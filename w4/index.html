<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第五人格風格 - 莊園留言板</title>
  
  <!-- 引入哥特風格英文字體與繁體中文預設字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       【1. 全局與配色設定 (可在此修改色彩概念)】
       ========================================================================== */
    :root {
      /* 背景與主色調 */
      --bg-color: #0f0b08;                 /* 莊園深夜背景色 */
      --card-bg: #211913;                  /* 羊皮紙/舊木盒卡片底色 */
      --card-border: #4a3625;              /* 卡片暗色縫線邊框 */
      
      /* 文字顏色 */
      --text-gold: #c2a675;                /* 羊皮紙金黃文字 */
      --text-muted: #8c7b6c;               /* 駐留時間與次要文字 */
      --text-highlight: #ffffff;           /* 聚焦卡片的亮白字 */
      
      /* 第五人格經典紅黑視覺 */
      --crimson-red: #8b0000;              /* 狂歡之椅/危險血紅 */
      --glow-gold: #ffcf60;                /* 聚焦時的黃金發光色 */
      
      /* 設定輪播轉場時間 */
      --transition-speed: 0.6s;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-gold);
      font-family: 'Noto Serif TC', serif;
      min-height: 100vh;
      padding: 2rem 1rem;
      background-image: 
        radial-gradient(circle at 50% 20%, #1a120c 0%, var(--bg-color) 80%);
      overflow-x: hidden;
    }

    /* 頁面大標題 */
    .header-title {
      text-align: center;
      font-family: 'Cinzel Decorative', 'Noto Serif TC', serif;
      font-size: 2.5rem;
      color: var(--text-gold);
      text-shadow: 0 0 10px rgba(139, 0, 0, 0.7), 2px 2px 4px #000;
      margin-bottom: 2rem;
      letter-spacing: 2px;
      position: relative;
    }

    .header-title::after {
      content: '—— 莊園秘密留言檔案-吳秉宸分區 ——';
      display: block;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 8px;
      letter-spacing: 4px;
    }

    /* ==========================================================================
       【2. 載入中酷炫動畫 (Loading Screen)】
       ========================================================================== */
    #loading-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 50vh;
    }

    /* 經典鈕扣眼睛旋轉動畫 */
    .button-eye-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid var(--card-border);
      border-top: 4px solid var(--crimson-red);
      border-radius: 50%;
      position: relative;
      animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
      box-shadow: 0 0 15px rgba(139, 0, 0, 0.5);
    }

    /* 鈕扣中間線條 */
    .button-eye-spinner::before, .button-eye-spinner::after {
      content: '';
      position: absolute;
      background-color: var(--text-gold);
    }
    .button-eye-spinner::before {
      top: 50%; left: 15%; right: 15%; height: 3px; transform: translateY(-50%);
    }
    .button-eye-spinner::after {
      left: 50%; top: 15%; bottom: 15%; width: 3px; transform: translateX(-50%);
    }

    @keyframes spin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.15); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .loading-text {
      margin-top: 1.5rem;
      font-size: 1.2rem;
      letter-spacing: 3px;
      color: var(--text-gold);
      text-shadow: 0 0 8px var(--crimson-red);
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }

    /* ==========================================================================
       【3. 瀑布流排版 (Masonry Layout)】
       ========================================================================== */
    .board-container {
      max-width: 1200px;
      margin: 0 auto;
      
      /* 利用 CSS Column 實現高低錯落瀑布流 */
      column-count: 3;
      column-gap: 1.5rem;
      
      display: none; /* 載入完成前先隱藏 */
    }

    /* 響應式斷點設定 */
    @media (max-width: 900px) {
      .board-container { column-count: 2; }
    }
    @media (max-width: 600px) {
      .board-container { column-count: 1; }
    }

    /* ==========================================================================
       【4. 卡片樣式與聚焦輪播特效 (Highlight Effects)】
       ========================================================================== */
    .card {
      break-inside: avoid;                 /* 防止卡片跨列斷裂 */
      margin-bottom: 1.5rem;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 4px;
      padding: 1.2rem;
      position: relative;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
      
      /* 動態縫線邊框視覺 */
      outline: 1px dashed #3a2a1d;
      outline-offset: -6px;

      /* 平滑轉場特效 */
      transition: all var(--transition-speed) ease-in-out;
      transform: scale(1);
      opacity: 0.85;
      filter: brightness(0.8) blur(0.5px);
    }

    /* 裝飾性圖標：卡片角落的縫線與鈕扣 */
    .card::before {
      content: '✖';
      position: absolute;
      top: 6px;
      right: 10px;
      font-size: 0.8rem;
      color: var(--crimson-red);
      opacity: 0.7;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(194, 166, 117, 0.2);
      padding-bottom: 0.5rem;
      margin-bottom: 0.8rem;
    }

    .card-author {
      font-weight: 900;
      font-size: 1.1rem;
      color: var(--text-gold);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-author::before {
      content: '●';
      color: var(--crimson-red);
      font-size: 0.7rem;
    }

    .card-time {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .card-content {
      font-size: 0.95rem;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
      color: #d1c2a5;
    }

    /* --------------------------------------------------------------------------
       【重要】聚焦 (Highlight) 狀態下的卡片樣式
       -------------------------------------------------------------------------- */
    .card.highlight {
      transform: scale(1.08);              /* 卡片放大 */
      opacity: 1;                          /* 完全不透明 */
      filter: brightness(1.15) blur(0px);  /* 高亮清析 */
      z-index: 10;                         /* 確保壓在其他卡片上方 */
      
      /* 金紅混色強烈發光與邊框 */
      border-color: var(--glow-gold);
      box-shadow: 
        0 0 20px rgba(255, 207, 96, 0.4),
        0 0 10px rgba(139, 0, 0, 0.8),
        inset 0 0 15px rgba(255, 207, 96, 0.2);
    }

    .card.highlight .card-author {
      color: var(--text-highlight);
      text-shadow: 0 0 5px var(--glow-gold);
    }

    /* 非聚焦卡片降暗模糊特效 */
    .board-container.has-highlight .card:not(.highlight) {
      opacity: 0.35;
      filter: brightness(0.5) blur(1.5px);
    }
  </style>
</head>
<body>

  <h1 class="header-title">O T H E R S</h1>

  <!-- 1. 載入動畫區域 -->
  <div id="loading-screen">
    <div class="button-eye-spinner"></div>
    <div class="loading-text">讀取留言中...</div>
  </div>

  <!-- 2. 留言卡片牆區域 -->
  <div id="board-container" class="board-container"></div>

  <script>
    // ==========================================================================
    // 【參數配置區 (方便後續修改)】
    // ==========================================================================
    const CONFIG = {
      // Google 試算表 CSV 發佈網址
      csvUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSAoHwFzD5JiYbTzy0aq8K7wkRqyBhq3HDYaf3e_uUxg6AA2240NTR63xetktbN1l7zB-pfqm-feZY9/pub?output=csv',
      
      /* 【輪播秒數控制】 單位：毫秒 (3000ms = 3秒) */
      carouselInterval: 3000 
    };

    // ==========================================================================
    // 【CSV 解析器】(防護留言內含逗號與換行符號)
    // ==========================================================================
    function parseCSV(csvText) {
      const lines = [];
      let row = [];
      let currentCell = '';
      let insideQuotes = false;

      for (let i = 0; i < csvText.length; i++) {
        const char = csvText[i];
        const nextChar = csvText[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            currentCell += '"';
            i++; // 跳過轉義雙引號
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (char === ',' && !insideQuotes) {
          row.push(currentCell.trim());
          currentCell = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          row.push(currentCell.trim());
          if (row.some(cell => cell !== '')) lines.push(row);
          row = [];
          currentCell = '';
        } else {
          currentCell += char;
        }
      }
      if (currentCell || row.length > 0) {
        row.push(currentCell.trim());
        lines.push(row);
      }
      return lines;
    }

    // HTML 安全字元防護 (避免 XSS 攻擊)
    function escapeHTML(str) {
      if (!str) return '';
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // ==========================================================================
    // 【核心邏輯：讀取資料與動態渲染】
    // ==========================================================================
    let cardsElements = []; // 儲存生成的 DOM 節點陣列
    let currentIndex = 0;   // 目前聚焦的卡片索引
    let carouselTimer = null;

    async function fetchAndRenderMessages() {
      const loadingScreen = document.getElementById('loading-screen');
      const boardContainer = document.getElementById('board-container');

      try {
        const response = await fetch(CONFIG.csvUrl);
        if (!response.ok) throw new Error('網路回應異常');
        
        const rawCSV = await response.text();
        const parsedData = parseCSV(rawCSV);

        // 移除 CSV 標題列 (時間戳記, 名字, 悄悄話)
        const dataRows = parsedData.slice(1);

        // 隱藏載入中動畫，顯示留言牆
        loadingScreen.style.display = 'none';
        boardContainer.style.display = 'block';

        if (dataRows.length === 0) {
          boardContainer.innerHTML = '<p style="text-align:center;">目前還沒有任何莊園留言...</p>';
          return;
        }

        // 動態生成留言卡片
        dataRows.forEach((row) => {
          // 欄位順序預設：[0] 時間戳記, [1] 名字, [2] 悄悄話
          const time = escapeHTML(row[0] || '未知時間');
          const name = escapeHTML(row[1] || '匿名訪客');
          const message = escapeHTML(row[2] || '（無內容）');

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-header">
              <span class="card-author">${name}</span>
              <span class="card-time">${time}</span>
            </div>
            <div class="card-content">${message}</div>
          `;

          boardContainer.appendChild(card);
        });

        // 取得所有渲染好的卡片節點
        cardsElements = Array.from(document.querySelectorAll('.card'));

        // 啟動輪播特效
        startCarousel();

      } catch (error) {
        console.error('讀取 CSV 失敗:', error);
        loadingScreen.innerHTML = `
          <div style="color: var(--crimson-red); font-weight: bold;">
            ⚠️ 讀取留言檔案失敗，請檢查網路連線或 CSV 網址。
          </div>
        `;
      }
    }

    // ==========================================================================
    // 【輪播特效邏輯】
    // ==========================================================================
    function startCarousel() {
      if (cardsElements.length === 0) return;

      const boardContainer = document.getElementById('board-container');
      boardContainer.classList.add('has-highlight');

      // 執行聚焦切換
      function highlightNextCard() {
        // 清除前一張卡片的聚焦狀態
        cardsElements.forEach(card => card.classList.remove('highlight'));

        // 為目前索引的卡片加上亮起特效
        const currentCard = cardsElements[currentIndex];
        currentCard.classList.add('highlight');

        // 計算下一張卡片索引 (循環繞回)
        currentIndex = (currentIndex + 1) % cardsElements.length;
      }

      // 立即執行第一次高亮
      highlightNextCard();

      /* 設定定時器：控制輪播切換頻率 */
      carouselTimer = setInterval(highlightNextCard, CONFIG.carouselInterval);
    }

    // 網頁載入完成後發動初始化
    document.addEventListener('DOMContentLoaded', fetchAndRenderMessages);
  </script>
</body>
</html>
