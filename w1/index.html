<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人數位名片</title>
  <!-- 引入 Google Fonts 繁體中文標準字型 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- 連結外部 CSS 樣式表 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 數位名片主體卡片 -->
  <div class="card">
    
    <!-- 圓形大頭貼 (可替換成你的照片檔案路徑) -->
    <img class="avatar" src="https://i.postimg.cc/g2BWrSpD/20260520-193825-(1).jpg" alt="個人大頭貼">
    
    <!-- 名字 -->
    <h1 class="name">吳秉宸</h1>
    
    <!-- 一行簡短自我介紹 -->
    <p class="bio">喜歡玩荒野亂鬥的傢伙 (學號:26122140)</p>
    
    <!-- 連結按鈕區域 -->
    <div class="button-group">
      <!-- 請將 href 的網址替換成你的 Instagram 個人頁面 -->
      <a href="https://instagram.com" target="_blank" class="btn btn-instagram">Instagram</a>
      
      <!-- 請將 mailto: 後面替換成你的 Email 信箱 -->
      <a href="mailto:your-email@example.com" class="btn btn-email">Email 聯絡我</a>
    </div>

  </div>

</body>
</html>
